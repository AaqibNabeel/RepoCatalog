name: Repo data health check

on:
  schedule:
    - cron: '0 6 * * *' # nightly, 6am UTC
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  health-check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run health check
        id: check
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/health-check.mjs

      - name: Commit refreshed data
        run: |
          git config user.name "repocatalog-bot"
          git config user.email "actions@github.com"
          git add src/data/repos.json
          git diff --staged --quiet || git commit -m "chore: nightly repo data refresh"
          git push

      - name: Fail workflow if issues were found
        if: steps.check.outcome == 'failure'
        run: exit 1
